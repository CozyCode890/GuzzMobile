# Phiên bản chốt ở Stage 0 bước C1 (2026-10-31), D24 và D25. Nguồn ghi trong Nhật ký của plans/stage-00-setup.md.

[versions]
# D130: phiên bản của Guzz Mobile (SemVer); versionCode tính ở app/build.gradle.kts.
guzz = "1.1.0"
agp = "9.3.3"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
# Stage 9 C3: khai báo thẳng (trước đến gián tiếp qua activity-compose). Từ 1.19, core-ktx đã gộp vào core.
core = "1.19.1"
datastore = "1.3.0"
coroutines = "1.11.0"
# Stage 9 (A2, 2026-11-18): 1.13.0 bỏ thay đổi phá vỡ của 1.12.0 (bọc ngoại lệ của serializer), vẫn dựa trên Kotlin 2.4.
serialization = "1.13.0"
junit = "6.1.3"
junit4 = "4.13.2"
# Test thiết bị (Stage 2, :core:media). Bản ổn định mới nhất trên Google Maven ngày 2026-11-10.
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# Client Gemini (Stage 3, D51). Bản mới nhất trên Maven Central ngày 2026-11-11.
okhttp = "5.5.1"
# Giao diện (Stage 8, D114, D115). Bản ổn định trên Google Maven ngày 2026-11-17; appcompat chỉ để đổi ngôn ngữ trong app.
navigationCompose = "2.10.2"
# appcompat 1.8.0 (Stage 9, A2): minSdk mặc định lên 23, vẫn dưới minSdk 26 của Guzz.
appcompat = "1.8.0"
# Bộ biểu tượng cơ bản đã ra khỏi Compose BOM: ghim bản cuối.
materialIconsCore = "1.7.8"

# Android SDK. compileSdk = targetSdk = bản ổn định mới nhất.
compileSdk = "37"
targetSdk = "37"
minSdk = "26"
buildTools = "37.0.0"

# Biên dịch bằng JDK 21, xuất bytecode 17 để D8 của Android chắc chắn đọc được.
jdk = "21"
jvmTarget = "17"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core = { module = "androidx.core:core", version.ref = "core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "materialIconsCore" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

# Chỉ build-logic dùng.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Convention plugin trong build-logic/ (D12).
guzz-jvm-library = { id = "guzz.jvm.library" }
guzz-android-library = { id = "guzz.android.library" }
guzz-android-application = { id = "guzz.android.application" }
guzz-android-compose = { id = "guzz.android.compose" }
